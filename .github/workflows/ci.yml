name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python: "3.9" }
          - { os: ubuntu-latest, python: "3.13" }
          - { os: macos-latest, python: "3.13" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build wheel, sdist and .deb
        run: |
          python -m pip install build
          python -m build
          sh packaging/build-deb.sh
      - name: Installed wheel runs
        run: |
          python -m venv /tmp/venv
          /tmp/venv/bin/pip install dist/*.whl
          /tmp/venv/bin/typerace --version
          /tmp/venv/bin/python -c "from typerace import app; assert len(app.all_quotes()) > 5000"
      - name: Installed .deb runs
        run: |
          sudo apt-get install -y ./dist/typerace_*_all.deb
          typerace --version
