name: demo

# Records docs/demo.gif with VHS (run from the Actions tab), and uploads it as
# an artifact to commit.

on:
  workflow_dispatch:

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install .
      - run: mkdir -p docs && python tools/demo.py demo.tape "$RUNNER_TEMP/typerace-demo"
      - uses: charmbracelet/vhs-action@v2
        with:
          path: demo.tape
      - uses: actions/upload-artifact@v4
        with:
          name: demo
          path: docs/demo.gif
